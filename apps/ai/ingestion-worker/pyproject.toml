
[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Document ingestion worker for the EU AI Act assistant"
readme = "README.md"
authors = [
    { name = "Saindou Houmadi ABASSE", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langfuse>=5.1.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
ingestion-worker = "ingestion_worker:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
warn_unreachable = true
show_error_codes = true
