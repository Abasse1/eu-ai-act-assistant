
[project]
name = "ai-service"
version = "0.1.0"
description = "AI service for the EU AI Act conversational assistant"
readme = "README.md"
authors = [
    { name = "Saindou Houmadi ABASSE", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.1.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pydantic-settings>=2.16.2",
    "spacy>=3.8.18",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-service = "ai_service:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
warn_unreachable = true
show_error_codes = true

[tool.ai_service.security]
prompt_injection_detection_enabled = true
prompt_injection_threshold = 0.85
prompt_injection_model = ""
