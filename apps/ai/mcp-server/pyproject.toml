
[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server for the EU AI Act assistant"
readme = "README.md"
authors = [
    { name = "Saindou Houmadi ABASSE", email = "" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
warn_unreachable = true
show_error_codes = true
