
services:
    postgres:
      image: postgres:17-alpine
      container_name: eu-ai-act-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "5432:5432"
      networks: [eu_ai_act_network]
      volumes:
        - postgres_data:/var/lib/postgresql/data

    otel-collector:
      image: otel/opentelemetry-collector-contrib:0.120.0
      container_name: eu-ai-act-otel-collector
      restart: unless-stopped
      command: ["--config=/etc/otelcol-contrib/config.yaml"]
      volumes:
        - ./infrastructure/observability/otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      ports:
        - "4317:4317"
        - "4318:4318"
      depends_on: 
        - tempo
      networks: [eu_ai_act_network]

    tempo:
      image: grafana/tempo:3.1.1
      container_name: eu-ai-act-tempo
      restart: unless-stopped
      command: ["-target=all","-config.file=/etc/tempo.yaml"]
      volumes: 
        - ./infrastructure/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
        - tempo_data:/var/tempo
      ports:
        - "3200:3200"
      networks: [eu_ai_act_network]

    prometheus:
      image: prom/prometheus:latest
      container_name: eu-ai-act-prometheus
      restart: unless-stopped
      command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
      volumes:
        - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus_data:/prometheus
      ports:
        - "9090:9090"
      networks: [eu_ai_act_network]

    grafana:
      image: grafana/grafana:latest
      container_name: eu-ai-act-grafana
      restart: unless-stopped
      environment:
        GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
        GF_USERS_ALLOW_SIGN_UP: "false"
      volumes:
        - grafana_data:/var/lib/grafana
        - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      ports:
        - "3000:3000"
      depends_on:
        - prometheus
        - tempo
      networks: [eu_ai_act_network]
  
    qdrant:
      image: qdrant/qdrant:latest
      ports:
        - "6333:6333"
        - "6334:6334"
      volumes: 
        - qdrant_data:/qdrant/storage
      restart: unless-stopped
      networks: [eu_ai_act_network]
    
    ollama:
      image: ollama/ollama:latest
      ports:
        - "11434:11434"
      volumes: 
        - ollama_data:/root/.ollama
      restart: unless-stopped
      networks: [eu_ai_act_network]

    mcp-server:
      build:
        context: .
        dockerfile: apps/ai/mcp-server/Dockerfile
      container_name: eu-ai-act-mcp-server
      ports:
        - "8001:8001"
      environment:
        MCP_HOST: "0.0.0.0"
        MCP_PORT: "8001"
        MCP_QDRANT_URL: "http://qdrant:6333"
        MCP_OLLAMA_BASE_URL: "http://ollama:11434"
      restart: unless-stopped
      depends_on:
        - ollama
        - qdrant
      networks: [eu_ai_act_network]

    ai-service:
      build:
        context: .
        dockerfile: apps/ai/ai-service/Dockerfile
      container_name: eu-ai-act-ai-service
      restart: unless-stopped
      ports:
        - "8002:8002"
      environment:
        APP_ENVIRONMENT: production
        LOG_LEVEL: INFO
        OTEL_SERVICE_NAME: EuAiAct.AI
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
        OLLAMA_BASE_URL: http://ollama:11434
        OLLAMA_MODEL: qwen3:8b
        MCP_SERVER_URL: http://mcp-server:8001/mcp
        PROMPT_INJECTION_DETECTOR_MODEL: /opt/models/prompt-injection-guard-small
        PROMPT_INJECTION_THRESHOLD: "0.85"
      depends_on:
        - mcp-server
        - ollama
        - otel-collector
      networks: [eu_ai_act_network]

networks:
  eu_ai_act_network:
    driver: bridge

volumes:
  postgres_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  qdrant_data: 
  ollama_data:
